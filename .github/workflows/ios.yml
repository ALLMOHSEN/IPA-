name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Unzip project
        run: |
          unzip -q -o ./*.zip -d _x
          cp -R _x/*/. .
          rm -rf _x

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project GalaxyPhoto.xcodeproj -scheme GalaxyPhoto \
            -sdk iphoneos -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GalaxyPhoto.app Payload/
          zip -qry GalaxyPhoto.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyPhoto-unsigned-ipa
          path: GalaxyPhoto.ipa
