name: Build iOS IPA

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest # يعمل على سيرفر ماك سحابي افتراضي

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild -project AlrubeiyLibrary.xcodeproj \
                     -scheme AlrubeiyLibrary \
                     -configuration Release \
                     -archivePath build/AlrubeiyLibrary.xcarchive \
                     archive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Export IPA (Unsigned / Ad-Hoc)
        run: |
          mkdir -p build/IPA
          # إنشاء مجلد Payload يدويًا لتغليف ملف الـ .app وضغطه كـ .ipa (مناسب للتطبيقات المحلية)
          mkdir -p Payload
          cp -r build/AlrubeiyLibrary.xcarchive/Products/Applications/AlrubeiyLibrary.app Payload/
          zip -r build/IPA/AlrubeiyLibrary.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlrubeiyLibrary-IPA
          path: build/IPA/AlrubeiyLibrary.ipa
